    <circle cx="58" cy="18" r="5" fill="#28c840"/>
    <rect x="18" y="54" width="86" height="176" rx="10" fill="#16212b"/>
    <rect x="32" y="72" width="58" height="8" rx="4" fill="#42b883"/>
    <rect x="32" y="94" width="46" height="8" rx="4" fill="#314556"/>
    <rect x="32" y="114" width="52" height="8" rx="4" fill="#314556"/>
    <rect x="32" y="134" width="40" height="8" rx="4" fill="#314556"/>
    <rect x="120" y="54" width="146" height="72" rx="12" fill="#182430"/>
