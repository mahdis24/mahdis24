<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mahdi Salek, frontend developer</title>
  <desc id="desc">Frontend developer in Yerevan. Vue.js, Nuxt.js, and TypeScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1220"/>
      <stop offset="52%" stop-color="#10241c"/>
      <stop offset="100%" stop-color="#0d1814"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#42b883" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#42b883" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2733"/>
      <stop offset="100%" stop-color="#121b24"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35495e"/>
      <stop offset="100%" stop-color="#42b883"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <circle cx="140" cy="300" r="90" fill="#42b883" opacity="0.08"/>

  <text x="64" y="108" fill="#42b883" font-family="Segoe UI, Ubuntu, sans-serif" font-size="15" font-weight="700" letter-spacing="3.5">FRONTEND DEVELOPER</text>
  <text x="64" y="168" fill="#f4f7fb" font-family="Segoe UI, Ubuntu, sans-serif" font-size="56" font-weight="700">Mahdi Salek</text>
  <rect x="64" y="186" width="78" height="4" rx="2" fill="#42b883"/>
  <text x="64" y="230" fill="#b7ebD4" font-family="Segoe UI, Ubuntu, sans-serif" font-size="20">Vue.js   ·   Nuxt.js   ·   TypeScript</text>
  <text x="64" y="264" fill="#8ea0b5" font-family="Segoe UI, Ubuntu, sans-serif" font-size="16">Yerevan, Armenia</text>

