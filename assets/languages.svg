<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title">
  <title id="title">Languages: Persian native, English professional working, German limited working</title>
  <rect width="560" height="250" rx="22" fill="#121a24" stroke="#243444"/>
  <rect x="28" y="28" width="6" height="28" rx="3" fill="#42b883"/>
  <text x="48" y="50" fill="#f4f7fb" font-family="Segoe UI, Ubuntu, sans-serif" font-size="22" font-weight="700">Languages</text>

  <g font-family="Segoe UI, Ubuntu, sans-serif">
    <text x="28" y="96" fill="#d5dee8" font-size="15">Persian</text>
    <text x="532" y="96" fill="#8ea0b5" font-size="14" text-anchor="end">Native</text>
    <rect x="28" y="108" width="504" height="10" rx="5" fill="#1c2c3a"/>
    <rect x="28" y="108" width="504" height="10" rx="5" fill="#42b883"/>

    <text x="28" y="154" fill="#d5dee8" font-size="15">English</text>
    <text x="532" y="154" fill="#8ea0b5" font-size="14" text-anchor="end">Professional</text>
    <rect x="28" y="166" width="504" height="10" rx="5" fill="#1c2c3a"/>
    <rect x="28" y="166" width="390" height="10" rx="5" fill="#42b883"/>

    <text x="28" y="212" fill="#d5dee8" font-size="15">German</text>
    <text x="532" y="212" fill="#8ea0b5" font-size="14" text-anchor="end">Limited</text>
    <rect x="28" y="224" width="504" height="10" rx="5" fill="#1c2c3a"/>
    <rect x="28" y="224" width="190" height="10" rx="5" fill="#35495e"/>
  </g>
</svg>
