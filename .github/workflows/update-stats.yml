name: Update GitHub Stats

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create output directory
        run: mkdir -p profile

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: 'user=mahdis24&hide_border=true&background=0D1117&stroke=1C2C3A&ring=42B883&fire=42B883&currStreakNum=F4F7FB&sideNums=F4F7FB&currStreakLabel=42B883&sideLabels=8EA0B5&dates=8EA0B5&mode=weekly&exclude_days=Sat,Sun'
          path: profile/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=mahdis24&show_icons=true&include_all_commits=true&theme=vue-dark&hide_border=true&bg_color=0d1117&title_color=42b883&icon_color=42b883&text_color=d5dee8&show=reviews,prs_merged,prs_merged_percentage&count_private=true'
          path: profile/stats.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=mahdis24&theme=vue-dark&hide_border=true&bg_color=0d1117&title_color=42b883&text_color=d5dee8&hide=rust,c,php&langs_count=6&size_weight=0.5&count_weight=0.5&layout=donut-vertical'
          path: profile/top-langs.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub stats" || exit 0
          git push
